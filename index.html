<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دمج الكرات - Ball Merge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0F0F1A;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }
        #game-wrapper {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            position: relative;
            background: linear-gradient(180deg, #0F0F1A, #1A1A2E);
        }
        /* الشاشة الرئيسية */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            color: white;
        }
        #home-screen h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #6C63FF, #00D2FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn {
            background: linear-gradient(135deg, #6C63FF, #00D2FF);
            border: none;
            color: white;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.5);
            transition: 0.2s;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        .points-badge {
            background: rgba(255,215,0,0.2);
            padding: 6px 16px;
            border-radius: 20px;
            color: gold;
            font-weight: bold;
        }
        /* شاشة اللعبة */
        #game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.3);
            color: white;
        }
        #game-header .score {
            background: linear-gradient(135deg, #6C63FF, #00D2FF);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        #game-header button {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        canvas {
            flex: 1;
            background: rgba(0,0,0,0.4);
            touch-action: none;
        }
        #game-footer {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            color: white;
        }
    </style>
</head>
<body>
<div id="game-wrapper">
    <!-- الشاشة الرئيسية -->
    <div id="home-screen">
        <h1>🎮 دمج الكرات</h1>
        <p style="color:#aaa;">أسقط الكرات وادمجها لتحقيق أعلى نتيجة</p>
        <div class="points-badge">⭐ نقاطك: <span id="total-points">12,500</span></div>
        <button class="btn" id="start-btn">▶ ابدأ اللعبة</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-screen">
        <div id="game-header">
            <button id="exit-btn">✕ خروج</button>
            <div class="score">⭐ <span id="current-score">0</span></div>
            <div style="width:50px;"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-footer">
            <span>⚡ <span id="energy">3/5</span></span>
            <button style="background: linear-gradient(135deg, #FFD700, #FFA000); border:none; padding:8px 15px; border-radius:15px; color:black; font-weight:bold;">▶ طاقة</button>
        </div>
    </div>
</div>

<script>
    // ---------- عناصر HTML ----------
    const homeScreen = document.getElementById('home-screen');
    const gameScreen = document.getElementById('game-screen');
    const startBtn = document.getElementById('start-btn');
    const exitBtn = document.getElementById('exit-btn');
    const totalPointsSpan = document.getElementById('total-points');
    const currentScoreSpan = document.getElementById('current-score');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- متغيرات اللعبة ----------
    let totalPoints = 12500;
    let score = 0;
    let gameRunning = false;
    let balls = [];
    let currentBall = null;
    let animationId = null;

    // ألوان الكرات
    const colors = ['#FF6B6B','#FF8E53','#FFD93D','#6BCB77','#4D96FF','#6C63FF','#9B59B6','#E91E63'];

    // ---------- تحجيم الكانفاس ----------
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height - 80; // ناقص الهيدر والفوتر
    }
    window.addEventListener('resize', () => { if (gameRunning) resizeCanvas(); });

    // ---------- كائن الكرة ----------
    class Ball {
        constructor(x, y, number) {
            this.x = x;
            this.y = y;
            this.number = number; // القيمة الفعلية (2، 4، 8 ...)
            this.value = Math.pow(2, number); // القيمة العددية
            this.radius = 20 + number * 3;
            this.color = colors[(number-1) % colors.length];
            this.vy = 0;
            this.vx = 0;
            this.merged = false;
        }
        draw(ctx) {
            // تدرج لوني
            const grad = ctx.createRadialGradient(this.x-4, this.y-4, 2, this.x, this.y, this.radius);
            grad.addColorStop(0, '#fff');
            grad.addColorStop(0.3, this.color);
            grad.addColorStop(1, this.color + 'AA');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.fill();
            // الرقم
            ctx.fillStyle = 'white';
            ctx.font = `bold ${this.radius*0.7}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.value, this.x, this.y);
        }
    }

    // ---------- إنشاء كرة جديدة في الأعلى ----------
    function spawnBall() {
        if (!gameRunning) return;
        const num = Math.random() < 0.7 ? 1 : (Math.random() < 0.7 ? 2 : 3);
        currentBall = new Ball(canvas.width/2, 30, num);
    }

    // ---------- إسقاط الكرة ----------
    function dropBall(x) {
        if (!currentBall || !gameRunning) return;
        currentBall.x = Math.max(currentBall.radius, Math.min(canvas.width - currentBall.radius, x));
        currentBall.vy = 4;
        balls.push(currentBall);
        score += 5;
        currentScoreSpan.textContent = score;
        currentBall = null;
        // ننتظر قليلاً ثم نفحص الدمج وننتج كرة جديدة
        setTimeout(() => {
            if (!gameRunning) return;
            checkMerges();
            checkGameOver();
            if (!currentBall) spawnBall();
        }, 500);
    }

    // ---------- فحص الدمج ----------
    function checkMerges() {
        let merged = false;
        for (let i = 0; i < balls.length; i++) {
            if (balls[i].merged) continue;
            for (let j = i+1; j < balls.length; j++) {
                if (balls[j].merged) continue;
                if (balls[i].number === balls[j].number) {
                    const dx = balls[i].x - balls[j].x;
                    const dy = balls[i].y - balls[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < balls[i].radius + balls[j].radius - 8) {
                        // دمج
                        balls[i].merged = true;
                        balls[j].merged = true;
                        const newNum = balls[i].number + 1;
                        const newX = (balls[i].x + balls[j].x) / 2;
                        const newY = (balls[i].y + balls[j].y) / 2;
                        balls.push(new Ball(newX, newY, newNum));
                        score += Math.pow(2, newNum) * 10;
                        currentScoreSpan.textContent = score;
                        merged = true;
                    }
                }
            }
        }
        // إزالة الكرات المدمجة
        balls = balls.filter(b => !b.merged);
        if (merged) {
            // إعادة فحص بعد فترة قصيرة
            setTimeout(() => {
                if (gameRunning) checkMerges();
            }, 300);
        }
    }

    // ---------- فحص نهاية اللعبة ----------
    function checkGameOver() {
        // إذا تجاوزت الكرات ارتفاع معين
        for (let b of balls) {
            if (b.y - b.radius < 20) {
                endGame();
                return;
            }
        }
    }

    function endGame() {
        gameRunning = false;
        alert(`انتهت اللعبة! لقد جمعت ${score} نقطة.\nشاهد إعلاناً لمضاعفتها إلى ${score*3}!`);
        score *= 3;
        totalPoints += score;
        totalPointsSpan.textContent = totalPoints.toLocaleString();
        goHome();
    }

    // ---------- العودة للشاشة الرئيسية ----------
    function goHome() {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        balls = [];
        currentBall = null;
        gameScreen.style.display = 'none';
        homeScreen.style.display = 'flex';
    }

    // ---------- بدء اللعبة ----------
    function startGame() {
        homeScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        resizeCanvas();
        balls = [];
        currentBall = null;
        score = 0;
        currentScoreSpan.textContent = '0';
        gameRunning = true;
        spawnBall();
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    // ---------- حلقة اللعبة ----------
    function gameLoop() {
        if (!gameRunning) {
            animationId = requestAnimationFrame(gameLoop);
            return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // تحديث ورسم الكرات
        for (let i = balls.length-1; i >= 0; i--) {
            const b = balls[i];
            b.vy += 0.6; // جاذبية
            b.y += b.vy;
            b.x += b.vx;

            // حدود الأرضية والجدران
            if (b.y + b.radius > canvas.height) {
                b.y = canvas.height - b.radius;
                b.vy *= -0.4;
            }
            if (b.x - b.radius < 0) {
                b.x = b.radius;
                b.vx *= -0.5;
            }
            if (b.x + b.radius > canvas.width) {
                b.x = canvas.width - b.radius;
                b.vx *= -0.5;
            }

            // احتكاك بسيط
            b.vy *= 0.995;
            b.vx *= 0.99;

            b.draw(ctx);
        }

        // رسم الكرة الحالية مع خط توجيه
        if (currentBall) {
            // خط متقطع
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.moveTo(currentBall.x, currentBall.radius);
            ctx.lineTo(currentBall.x, canvas.height - currentBall.radius);
            ctx.stroke();
            ctx.setLineDash([]);

            currentBall.y = 30; // تبقى في الأعلى
            currentBall.draw(ctx);
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    // ---------- أحداث التحكم ----------
    canvas.addEventListener('mousemove', (e) => {
        if (!currentBall || !gameRunning) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        currentBall.x = Math.max(currentBall.radius, Math.min(canvas.width - currentBall.radius, x));
    });
    canvas.addEventListener('click', (e) => {
        if (!gameRunning || !currentBall) return;
        dropBall(currentBall.x);
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!currentBall || !gameRunning) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        currentBall.x = Math.max(currentBall.radius, Math.min(canvas.width - currentBall.radius, x));
    }, {passive: false});
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (!gameRunning || !currentBall) return;
        dropBall(currentBall.x);
    });

    // أزرار التحكم
    startBtn.addEventListener('click', startGame);
    exitBtn.addEventListener('click', goHome);
</script>
</body>
</html>
