<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>دمج الكرات - Ball Merge Game</title>
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #00D2FF;
            --gold: #FFD700;
            --dark: #0F0F1A;
            --surface: #1A1A2E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #app {
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0F0F1A, #1A1A2E);
        }

        /* شاشة البداية */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .start-screen h1 {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-btn {
            background: linear-gradient(135deg, #6C63FF, #00D2FF);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.4);
            transition: transform 0.2s;
            width: 80%;
            max-width: 300px;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* شاشة اللعبة */
        .game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(0,0,0,0.3);
        }

        .score {
            background: linear-gradient(135deg, #6C63FF, #00D2FF);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
        }

        #gameCanvas {
            flex: 1;
            background: rgba(0,0,0,0.4);
            display: block;
            touch-action: none;
        }

        .game-footer {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
        }

        .energy-badge {
            background: rgba(255,171,64,0.2);
            padding: 6px 12px;
            border-radius: 15px;
            color: #FFAB40;
            font-weight: bold;
        }

        .ad-btn {
            background: linear-gradient(135deg, #FFD700, #FFA000);
            border: none;
            color: black;
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- شاشة البداية -->
        <div id="startScreen" class="start-screen">
            <h1>🎮 دمج الكرات</h1>
            <p style="color:#aaa; margin-bottom:20px;">أسقط الكرات وادمجها لتحقيق أعلى نتيجة</p>
            <button class="start-btn" onclick="startGame()">▶ ابدأ اللعبة الآن</button>
            <p style="margin-top:30px; color:#666; font-size:14px;">⭐ نقاطك: <span id="pointsDisplay">12,500</span></p>
        </div>

        <!-- شاشة اللعبة -->
        <div id="gameScreen" class="game-screen hidden">
            <div class="game-header">
                <button class="back-btn" onclick="exitGame()">✕ خروج</button>
                <div class="score">⭐ <span id="scoreDisplay">0</span></div>
                <div style="width:50px;"></div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div class="game-footer">
                <div class="energy-badge">⚡ <span id="energyDisplay">3/5</span></div>
                <button class="ad-btn" onclick="fakeAdEnergy()">▶ طاقة مجانية</button>
            </div>
        </div>
    </div>

    <script>
        // ========== إعدادات اللعبة ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let balls = [];
        let currentBall = null;
        let gameRunning = false;
        let score = 0;
        let dropX = 0;
        let animationId;

        const BALL_COLORS = [
            '#FF6B6B', '#FF8E53', '#FFD93D', '#6BCB77',
            '#4D96FF', '#6C63FF', '#9B59B6', '#E91E63'
        ];

        class Ball {
            constructor(x, y, number) {
                this.x = x;
                this.y = y;
                this.number = number; // 1,2,3...
                this.radius = 20 + number * 3;
                this.color = BALL_COLORS[(number-1) % BALL_COLORS.length];
                this.vy = 0;
                this.vx = 0;
                this.merged = false;
            }
            draw(ctx) {
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                const grad = ctx.createRadialGradient(this.x-5, this.y-5, 2, this.x, this.y, this.radius);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.4, this.color);
                grad.addColorStop(1, this.color + '88');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = `bold ${this.radius*0.7}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Math.pow(2, this.number), this.x, this.y);
            }
        }

        // ========== التحكم بالشاشات ==========
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            resizeCanvas();
            initGame();
        }

        function exitGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            // إضافة نقاط اللعبة إلى الرصيد
            const ptsEl = document.getElementById('pointsDisplay');
            ptsEl.textContent = parseInt(ptsEl.textContent.replace(',','')) + score;
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight - 100; // ناقص الهيدر والفوتر
            if (canvas.height < 300) canvas.height = 400; // حد أدنى
        }

        // ========== آليات اللعبة ==========
        function initGame() {
            balls = [];
            currentBall = null;
            score = 0;
            document.getElementById('scoreDisplay').textContent = '0';
            gameRunning = true;
            spawnNewBall();
            gameLoop();
        }

        function spawnNewBall() {
            if (!gameRunning) return;
            const num = Math.random() < 0.7 ? 1 : (Math.random() < 0.7 ? 2 : 3);
            currentBall = new Ball(canvas.width/2, -30, num);
            dropX = canvas.width/2;
        }

        function dropBall() {
            if (!currentBall || !gameRunning) return;
            currentBall.vy = 3;
            balls.push(currentBall);
            score += 5;
            document.getElementById('scoreDisplay').textContent = score;
            currentBall = null;
            setTimeout(() => {
                if (gameRunning) {
                    checkMerges();
                    checkGameOver();
                    if (!currentBall) spawnNewBall();
                }
            }, 400);
        }

        function checkMerges() {
            let merged = false;
            for (let i = 0; i < balls.length; i++) {
                if (balls[i].merged) continue;
                for (let j = i+1; j < balls.length; j++) {
                    if (balls[j].merged) continue;
                    if (balls[i].number === balls[j].number) {
                        const dx = balls[i].x - balls[j].x;
                        const dy = balls[i].y - balls[j].y;
                        const dist = Math.sqrt(dx*dx+dy*dy);
                        if (dist < balls[i].radius + balls[j].radius - 8) {
                            const newNum = balls[i].number + 1;
                            const newX = (balls[i].x + balls[j].x)/2;
                            const newY = (balls[i].y + balls[j].y)/2;
                            balls[i].merged = true;
                            balls[j].merged = true;
                            balls.push(new Ball(newX, newY, newNum));
                            score += Math.pow(2, newNum) * 10;
                            document.getElementById('scoreDisplay').textContent = score;
                            merged = true;
                        }
                    }
                }
            }
            balls = balls.filter(b => !b.merged);
            if (merged) setTimeout(checkMerges, 200);
        }

        function checkGameOver() {
            if (balls.length > 15) {
                gameRunning = false;
                alert(`انتهت اللعبة! لقد جمعت ${score} نقطة.\nشاهد إعلاناً لمضاعفتها إلى ${score*3} نقطة!`);
                // مضاعفة تلقائية (محاكاة)
                score *= 3;
                document.getElementById('scoreDisplay').textContent = score;
                // إعادة تعيين
                balls = [];
                currentBall = null;
                gameRunning = true;
                spawnNewBall();
            }
        }

        function gameLoop() {
            if (!gameRunning) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // رسم الكرات المستقرة
            balls.forEach(b => {
                b.vy += 0.5;
                b.y += b.vy;
                b.x += b.vx;
                if (b.y + b.radius > canvas.height) {
                    b.y = canvas.height - b.radius;
                    b.vy *= -0.4;
                }
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.vx *= -0.5;
                }
                if (b.x + b.radius > canvas.width) {
                    b.x = canvas.width - b.radius;
                    b.vx *= -0.5;
                }
                b.vy *= 0.99;
                b.vx *= 0.99;
                b.draw(ctx);
            });
            // رسم الكرة الحالية
            if (currentBall) {
                currentBall.x = dropX;
                currentBall.y = -currentBall.radius;
                currentBall.draw(ctx);
                // خط إرشاد
                ctx.setLineDash([5,5]);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.moveTo(currentBall.x, currentBall.radius);
                ctx.lineTo(currentBall.x, canvas.height - currentBall.radius);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        // ========== أحداث اللمس والفأرة ==========
        canvas.addEventListener('mousemove', (e) => {
            if (currentBall && gameRunning) {
                const rect = canvas.getBoundingClientRect();
                dropX = e.clientX - rect.left;
                dropX = Math.max(20, Math.min(canvas.width-20, dropX));
            }
        });
        canvas.addEventListener('click', () => {
            if (currentBall && gameRunning) dropBall();
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (currentBall && gameRunning) {
                const rect = canvas.getBoundingClientRect();
                dropX = e.touches[0].clientX - rect.left;
                dropX = Math.max(20, Math.min(canvas.width-20, dropX));
            }
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (currentBall && gameRunning) dropBall();
        });

        window.addEventListener('resize', () => {
            if (gameRunning) resizeCanvas();
        });

        function fakeAdEnergy() {
            alert('⚡ تمت مشاهدة الإعلان (محاكاة)\nتم استعادة الطاقة!');
        }
    </script>
</body>
</html>
