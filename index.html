<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القفز (Doodle Jump)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50; /* لون خلفية الصفحة */
            font-family: Tahoma, sans-serif;
        }
        canvas {
            background-color: #f1f1d4; /* لون خلفية اللعبة الكلاسيكي */
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isGameOver = false;
    let score = 0;

    // إعدادات اللاعب (الكائن الفضائي)
    const doodler = {
        x: 180,
        y: 300,
        width: 40,
        height: 40,
        dx: 0,
        dy: 0,
        gravity: 0.4,
        jumpStrength: -10,
        speed: 5
    };

    let platforms = [];
    const platformWidth = 65;
    const platformHeight = 12;

    // توليد المنصات الأولى
    function createPlatforms() {
        platforms = [];
        platforms.push({ x: doodler.x, y: doodler.y + 80 }); 
        for (let i = 0; i < 7; i++) {
            let x = Math.random() * (canvas.width - platformWidth);
            let y = canvas.height - 80 * i - 100;
            platforms.push({ x, y });
        }
    }

    // رسم اللاعب (شكل مبسط يشبه الصورة)
    function drawDoodler() {
        ctx.fillStyle = '#b3c100'; // اللون الأخضر المصفر
        ctx.beginPath();
        ctx.roundRect(doodler.x, doodler.y, doodler.width, doodler.height, 10);
        ctx.fill();
        
        // العيون
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(doodler.x + 12, doodler.y + 15, 3, 0, Math.PI * 2);
        ctx.arc(doodler.x + 28, doodler.y + 15, 3, 0, Math.PI * 2);
        ctx.fill();
        
        // الأنف الفضائي
        ctx.fillRect(doodler.x + 35, doodler.y + 20, 15, 6);
    }

    // رسم المنصات
    function drawPlatforms() {
        ctx.fillStyle = '#55a630';
        platforms.forEach(p => {
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, platformWidth, platformHeight, 5);
            ctx.fill();
        });
    }

    // تحريك المنصات للأسفل عند صعود اللاعب
    function updatePlatforms() {
        if (doodler.y < canvas.height / 2) {
            doodler.y = canvas.height / 2; 
            platforms.forEach(p => {
                p.y -= doodler.dy;
            });
            score += 0.1; 
        }

        if (platforms[0].y > canvas.height) {
            platforms.shift(); 
            let x = Math.random() * (canvas.width - platformWidth);
            let y = platforms[platforms.length - 1].y - 80;
            platforms.push({ x, y });
        }
    }

    // حلقة اللعبة الرئيسية
    function update() {
        if (isGameOver) {
            // شاشة الخسارة
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 30px Tahoma';
            ctx.fillText('انتهت اللعبة!', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '20px Tahoma';
            ctx.fillText('النقاط: ' + Math.floor(score), canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText('اضغط Enter للإعادة', canvas.width / 2, canvas.height / 2 + 60);
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // الجاذبية والحركة
        doodler.dy += doodler.gravity;
        doodler.x += doodler.dx;
        doodler.y += doodler.dy;

        // الخروج من يمين الشاشة والظهور من اليسار (والعكس)
        if (doodler.x + doodler.width < 0) doodler.x = canvas.width;
        if (doodler.x > canvas.width) doodler.x = -doodler.width;

        // التصادم مع المنصات (يحدث فقط أثناء النزول)
        if (doodler.dy > 0) {
            platforms.forEach(p => {
                if (
                    doodler.x < p.x + platformWidth &&
                    doodler.x + doodler.width > p.x &&
                    doodler.y + doodler.height > p.y &&
                    doodler.y + doodler.height < p.y + platformHeight + doodler.dy
                ) {
                    doodler.dy = doodler.jumpStrength; // تفعيل القفز
                }
            });
        }

        // التحقق من السقوط (الخسارة)
        if (doodler.y > canvas.height) {
            isGameOver = true;
        }

        updatePlatforms();
        drawPlatforms();
        drawDoodler();

        // رسم عداد النقاط
        ctx.fillStyle = '#333';
        ctx.font = 'bold 20px Tahoma';
        ctx.textAlign = 'right';
        ctx.fillText('النقاط: ' + Math.floor(score), canvas.width - 20, 30);

        requestAnimationFrame(update);
    }

    // التحكم بالأسهم
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
            doodler.dx = -doodler.speed;
        } else if (e.key === 'ArrowRight') {
            doodler.dx = doodler.speed;
        }
        
        if (isGameOver && e.key === 'Enter') {
            resetGame();
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            doodler.dx = 0; // إيقاف الحركة عند رفع الإصبع عن السهم
        }
    });

    function resetGame() {
        isGameOver = false;
        score = 0;
        doodler.x = 180;
        doodler.y = 300;
        doodler.dy = 0;
        doodler.dx = 0;
        createPlatforms();
        requestAnimationFrame(update);
    }

    // بدء اللعبة لأول مرة
    createPlatforms();
    update();

</script>
</body>
</html>
